name: Sanity — Pattern-Based Tests

on:
  workflow_dispatch:
    inputs:
      grep_pattern:
        description: 'Grep pattern for test filtering'
        required: true
        default: '@critical'

jobs:
  sanity:
    name: Sanity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Install Playwright browsers
        run: bun playwright install chromium --with-deps
      - name: Run pattern tests
        run: bun playwright test --grep "${{ github.event.inputs.grep_pattern }}" || bun playwright test --grep '@critical'
        env:
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_STUDENT_EMAIL: ${{ secrets.TEST_STUDENT_EMAIL }}
          TEST_STUDENT_PASSWORD: ${{ secrets.TEST_STUDENT_PASSWORD }}
          VITE_API_URL: http://localhost:3000/api/v1
